name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  linux:
    name: GNU/Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout boba
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config \
            tmux

      - name: Build
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(nproc)"

      - name: Run tests
        run: make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/tests/*.log
          retention-days: 7

  windows:
    name: Windows (UCRT64)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Real MSYS2 UCRT64 shell: build-ucrt64.sh requires MSYSTEM=UCRT64
        # (Git Bash would leave it unset and re-exec through msys2_shell.cmd).
        shell: msys2 {0}

    steps:
      - name: Checkout boba
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # mingw-w64-ucrt-x86_64-toolchain provides gcc/binutils/headers for
      # UCRT64 (its make member only ships mingw32-make.exe, so the MSYS
      # `make` package is also needed — see nevermore). git is needed for
      # autogen.sh's version regeneration.
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |-
            autoconf
            automake
            libtool
            make
            git
            mingw-w64-ucrt-x86_64-toolchain
            pkg-config

      - name: Build + test (unit only; tmux e2e is Unix-only)
        run: ./scripts/build-ucrt64.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-windows
          path: build/tests/*.log
          retention-days: 7

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout boba
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install autoconf automake libtool make tmux

      - name: Build
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests (unit + tmux e2e)
        run: make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-macos
          path: build/tests/*.log
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout boba
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config

      - name: Build dist tarball
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: build/boba-*.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
